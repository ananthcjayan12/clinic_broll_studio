[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinic-broll-studio"
version = "0.1.0"
description = "Controlled Malayalam talking-head to layered B-roll video production studio"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Clinic B-roll Studio"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
  "requests>=2.32,<3",
  "sarvamai>=0.1.28,<0.2",
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "Pillow>=10.4,<12",
]

[project.optional-dependencies]
matting = ["mediapipe>=0.10.14,<0.11"]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1"]

[project.scripts]
clinic-broll = "clinic_broll.cli:main"

[tool.setuptools.packages.find]
include = ["clinic_broll*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.setuptools.package-data]
clinic_broll = [
  "prompts/*.txt",
  "schemas/*.json",
  "studio/static/*",
]
