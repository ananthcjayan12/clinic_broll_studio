name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -e '.[dev]' --quiet
      - name: Install render runtime
        run: npm ci --ignore-scripts --silent
      - name: Run full Python suite
        id: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest.log
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: pytest.log
          if-no-files-found: error
          retention-days: 14
      - run: python -m compileall -q clinic_broll scripts
      - run: node --check clinic_broll/studio/static/simple-app.js
      - run: node --check clinic_broll/studio/static/app.js
      - run: node --check clinic_broll/studio/static/dialogue-v2.js
      - run: npx hyperframes --version
