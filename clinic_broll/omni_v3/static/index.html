<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Clinic Omni Reel Studio</title>
<style>
:root{--teal:#0f9f92;--teal2:#dff7f3;--ink:#14211f;--muted:#66736f;--line:#dfe7e4;--bg:#f4f7f6;--card:#fff;--danger:#c84a4a;--shadow:0 18px 50px rgba(22,52,47,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{background:#10211e;color:#fff;padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}.mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--teal);font-weight:900}.brand span{display:block;color:#b9cbc7;font-size:12px}.primary,.secondary,.ghost,.danger{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--teal);color:#fff}.secondary{background:var(--teal2);color:#086c63}.ghost{background:#eef3f1;color:#34423f}.danger{background:#ffe8e8;color:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}.full{width:100%}.runs{display:grid;gap:8px;margin-top:18px}.run{width:100%;text-align:left;background:#18302b;color:#fff;border:1px solid #294740;border-radius:12px;padding:12px;cursor:pointer}.run.active{border-color:#6de3d4;background:#1d3933}.run small{display:block;color:#aac1bc}.main{padding:30px;max-width:1440px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.16em;color:var(--teal);text-transform:uppercase}h1,h2,h3{margin:.25em 0}.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);gap:20px}.stack{display:grid;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.video{aspect-ratio:9/16;max-height:650px;margin:auto;background:#0c1211;border-radius:18px;overflow:hidden;display:grid;place-items:center}.video video{width:100%;height:100%;object-fit:contain}.muted{color:var(--muted)}.stages{display:grid;gap:8px;margin-top:14px}.stage{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px}.stage .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#eef4f2;font-weight:900}.stage.complete .n{background:var(--teal);color:#fff}.stage.failed{border-color:#efb4b4}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.dialogue{display:grid;gap:10px}.edit{border:1px solid var(--line);border-radius:14px;padding:12px}.edit.risk{border-color:#e8b670;background:#fff9ef}.edit-head{display:flex;justify-content:space-between;gap:10px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;background:#eef3f1;padding:4px 8px;border-radius:999px}.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.job{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff}.job img,.job video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:14px;background:#111}.job .meta,.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.metric{background:#f2f6f4;border-radius:10px;padding:9px}.metric small{display:block;color:var(--muted)}.status{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef3f1;font-weight:800;font-size:12px}.status.approved{background:#dff7e9;color:#167045}.status.review{background:#fff2d6;color:#8a5c00}.status.fallback{background:#edf0f5;color:#4e596b}.status.ready{background:#e3f3ff;color:#17688d}.prompt{white-space:pre-wrap;background:#13231f;color:#dff7f3;padding:12px;border-radius:12px;max-height:170px;overflow:auto;font-size:12px}.drop{border:1px dashed #8eb9b1;border-radius:12px;padding:10px;margin-top:10px}.empty{padding:60px 20px;text-align:center;color:var(--muted)}dialog{border:0;border-radius:20px;padding:0;box-shadow:0 30px 100px rgba(0,0,0,.25);width:min(560px,92vw)}dialog form{padding:22px;display:grid;gap:14px}label{font-weight:750;display:grid;gap:6px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit}.toast{position:fixed;right:20px;bottom:20px;background:#10211e;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.grid{grid-template-columns:1fr}.main{padding:18px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="mark">O</div><div><strong>Clinic Omni Studio</strong><span>Flow handoff · V3</span></div></div>
  <button class="primary full" id="newBtn">＋ New production</button>
  <div class="runs" id="runs"></div>
</aside>
<main class="main">
  <div class="top"><div><div class="eyebrow">OMNI-FIRST PRESENTER REELS</div><h1 id="title">Start a production</h1></div><div id="topActions"></div></div>
  <div id="content" class="empty">Upload Dr Pooja’s talking-head video to begin.</div>
</main>
</div>
<dialog id="createDialog"><form id="createForm"><div><div class="eyebrow">NEW PRODUCTION</div><h2>Upload the raw reel</h2></div><label>Project name<input name="run_id" required pattern="[a-z0-9][a-z0-9._-]{0,95}" placeholder="brushing-after-food" /></label><label>Video<input name="video" type="file" accept="video/mp4,video/quicktime,video/webm" required /></label><label>Editing intensity<select name="editing_intensity"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label><label>Maximum Omni jobs<input name="max_omni_jobs" type="number" min="1" max="8" value="5" /></label><label>Maximum authorised credits<input name="max_omni_credits" type="number" min="40" max="800" step="40" value="280" /></label><div class="actions"><button class="primary" type="submit">Create</button><button class="ghost" type="button" id="closeDialog">Cancel</button></div></form></dialog>
<div class="toast" id="toast"></div>
<script>
const state={runs:[],active:null,dialogue:null,timer:null};
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})}});if(!r.ok){let d;try{d=await r.json()}catch{d={detail:await r.text()}}throw new Error(d.detail||`HTTP ${r.status}`)}return (r.headers.get('content-type')||'').includes('json')?r.json():r.text()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
async function boot(){await loadRuns();state.timer=setInterval(refresh,2500)}
async function loadRuns(){state.runs=await api('/api/runs');renderRuns();if(!state.active&&state.runs[0])await selectRun(state.runs[0].run_id)}
function renderRuns(){$('#runs').innerHTML=state.runs.map(r=>`<button class="run ${state.active?.run_id===r.run_id?'active':''}" data-run="${esc(r.run_id)}"><strong>${esc(r.run_id)}</strong><small>${r.final_ready?'Final ready':`Next stage ${r.next_stage||'—'}`}</small></button>`).join('')||'<span style="color:#9eb6b0">No productions yet.</span>';document.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>selectRun(b.dataset.run))}
async function selectRun(id){state.active=await api(`/api/runs/${encodeURIComponent(id)}`);try{state.dialogue=await api(`/api/dialogue/runs/${encodeURIComponent(id)}`)}catch{state.dialogue=null}renderRuns();render()}
async function refresh(){if(!state.active)return;try{const fresh=await api(`/api/runs/${encodeURIComponent(state.active.run_id)}`);const changed=JSON.stringify({s:fresh.stages,p:fresh.process,m:fresh.omni_manifest,a:fresh.artifacts,u:fresh.dialogue_unresolved})!==JSON.stringify({s:state.active.stages,p:state.active.process,m:state.active.omni_manifest,a:state.active.artifacts,u:state.active.dialogue_unresolved});state.active=fresh;if(changed){try{state.dialogue=await api(`/api/dialogue/runs/${encodeURIComponent(fresh.run_id)}`)}catch{}render();await loadRuns()}}catch{}}
function stageStatus(n){return state.active?.stages?.find(s=>Number(s.number)===n)?.status||'pending'}
function stageLabel(s){return ({6:'Omni Reel Director',7:'Prepare Flow inputs and prompts',8:'Receive Omni results',9:'Review Omni outputs',10:'Lock continuity-ready media'}[Number(s.number)]||s.label)}
function artifactVideo(){const a=state.active.artifacts||{};return a.final||a.preview||a.clean||a.source}
function render(){const r=state.active;if(!r)return;$('#title').textContent=r.run_id;$('#topActions').innerHTML=r.artifacts.final?`<a class="primary" href="${r.artifacts.final}" download>Download final MP4</a>`:'';const video=artifactVideo();$('#content').className='';$('#content').innerHTML=`<div class="grid"><div class="stack"><section class="card"><div class="eyebrow">CURRENT VIDEO</div><h2>${r.artifacts.final?'Final reel':r.artifacts.preview?'Complete preview':r.artifacts.clean?'Clean master':'Source video'}</h2><div class="video">${video?`<video controls src="${video}"></video>`:'No prepared video yet'}</div></section>${dialogueCard()}${omniCard()}</div><div class="stack">${workflowCard()}${planCard()}${processCard()}</div></div>`;bind()}
function workflowCard(){const r=state.active;return `<section class="card"><div class="eyebrow">WORKFLOW</div><h2>One guided path</h2><div class="stages">${r.stages.map(s=>`<div class="stage ${esc(s.status)}"><div class="n">${s.status==='complete'?'✓':s.number}</div><div><strong>${esc(stageLabel(s))}</strong><div class="muted">${esc(s.status)}${s.error?' · '+esc(s.error):''}</div></div></div>`).join('')}</div><div class="actions">${nextActions()}</div></section>`}
function nextActions(){const r=state.active,p=r.process||{};if(p.running)return `<button class="primary" disabled>${esc(p.label||'Working…')}</button>`;const s=n=>stageStatus(n);let out=[];if(s(3)!=='complete')out.push(`<button class="primary" data-action="analyse">Transcribe & find dialogue cuts</button>`);else if(Number(r.dialogue_unresolved)>0)out.push(`<button class="primary" disabled>Resolve dialogue edits below</button>`);else if(s(5)!=='complete')out.push(`<button class="primary" data-action="clean">Create clean master</button>`);else if(s(6)!=='complete')out.push(`<button class="primary" data-action="direct">AI Direct the reel</button>`);else if(s(7)!=='complete')out.push(`<button class="primary" data-action="prepare">Prepare Flow jobs</button>`);else if(s(10)!=='complete')out.push(`<button class="primary" data-action="finalise">Finalise Omni timeline</button>`);else if(s(13)!=='complete')out.push(`<button class="primary" data-action="preview">Build complete preview</button>`);else if(s(15)!=='complete')out.push(`<button class="primary" data-action="render">Approve & render</button>`);else out.push(`<span class="status approved">Production complete</span>`);return out.join('')}
function dialogueCard(){if(stageStatus(3)!=='complete'||stageStatus(4)==='complete')return '';const edits=state.dialogue?.plan?.edits||[];return `<section class="card"><div class="eyebrow">DIALOGUE REVIEW</div><h2>Approve only safe cuts</h2><p class="muted">The source is immutable. Medical statements and negations should be reviewed manually.</p><div class="actions"><button class="secondary" data-dialogue-safe>Approve safe suggestions</button></div><div class="dialogue">${edits.map(e=>`<article class="edit ${e.requires_review?'risk':''}"><div class="edit-head"><strong>${esc(e.transcript||e.category)}</strong><span class="chip">${Number(e.start).toFixed(2)}–${Number(e.end).toFixed(2)}s</span></div><p class="muted">${esc(e.reason||'')}</p><div class="chips"><span class="chip">${esc(e.category)}</span><span class="chip">${esc(e.status)}</span>${e.medical_risk&&e.medical_risk!=='none'?`<span class="chip">risk: ${esc(e.medical_risk)}</span>`:''}</div>${e.status==='suggested'?`<div class="actions"><button class="secondary" data-dialogue-action="approve_recommendation" data-edit="${esc(e.edit_id)}">Approve recommendation</button><button class="ghost" data-dialogue-action="keep" data-edit="${esc(e.edit_id)}">Keep original</button></div>`:''}</article>`).join('')||'<p class="muted">No cleanup suggestions. Continue to the clean master.</p>'}</div></section>`}
function planCard(){const p=state.active.omni_plan||{};if(!p.jobs?.length)return `<section class="card"><div class="eyebrow">DIRECTOR PLAN</div><h2>Waiting for AI direction</h2><p class="muted">The Director will select a few high-value Omni edits and preserve original footage in every gap.</p></section>`;return `<section class="card"><div class="eyebrow">DIRECTOR PLAN</div><h2>${p.jobs.length} Omni edits</h2><div class="meta"><div class="metric"><small>Estimated credits</small><strong>${p.estimated_credits}</strong></div><div class="metric"><small>Timeline scenes</small><strong>${p.scenes.length}</strong></div></div><p class="muted">${esc(p.summary)}</p><a class="secondary" href="${state.active.artifacts.plan||'#'}" target="_blank">Open plan JSON</a></section>`}
function omniCard(){const m=state.active.omni_manifest||{};if(!m.jobs?.length)return '';return `<section class="card"><div class="eyebrow">GOOGLE FLOW HANDOFF</div><h2>${m.jobs.length} prepared Omni jobs</h2><p class="muted">Use Gemini Omni Flash, one output per job. The original clean audio is restored later.</p><div class="jobs">${m.jobs.map(jobCard).join('')}</div></section>`}
function jobCard(j){const media=j.normalised_result_url?`<video controls src="${j.normalised_result_url}"></video>`:`<img src="${j.thumbnail_url}" alt="${esc(j.job_id)}"/>`;return `<article class="job"><div style="display:flex;justify-content:space-between;align-items:center"><h3>${esc(j.job_id)}</h3><span class="status ${esc(j.status)}">${esc(j.status)}</span></div>${media}<div class="meta"><div class="metric"><small>Timeline</small><strong>${Number(j.start).toFixed(1)}–${Number(j.end).toFixed(1)}s</strong></div><div class="metric"><small>Credits</small><strong>${j.estimated_credits}</strong></div></div><p><strong>${esc(j.purpose)}</strong></p><div class="prompt">${esc(j.prompt)}</div><div class="actions"><a class="secondary" href="${j.input_url}" download>Download input</a><button class="ghost" data-copy="${esc(j.job_id)}">Copy prompt</button><a class="ghost" href="https://labs.google/fx/tools/flow" target="_blank">Open Flow</a></div><label class="drop">Upload completed Omni result<input type="file" accept="video/mp4,video/quicktime,video/webm" data-upload="${esc(j.job_id)}" /></label>${j.qc?`<p class="muted">Normalised ${j.qc.normalised_duration}s · retime ${j.qc.retime_ratio}× · manual identity review required</p>`:''}<div class="actions"><button class="primary" data-job-action="approve" data-job="${esc(j.job_id)}" ${j.status==='review'?'':'disabled'}>Approve</button><button class="ghost" data-job-action="retry" data-job="${esc(j.job_id)}">Retry</button><button class="danger" data-job-action="fallback" data-job="${esc(j.job_id)}">Use original</button></div></article>`}
function processCard(){const p=state.active.process||{};return `<section class="card"><div class="eyebrow">PROCESS</div><h2>${p.running?esc(p.label):p.error?'Action failed':'System ready'}</h2>${p.error?`<p style="color:#b33">${esc(p.error)}</p>`:'<p class="muted">Flow remains manual so the workflow uses your Google AI Pro subscription rather than a paid media API.</p>'}</section>`}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>runAction(b.dataset.action));const safe=document.querySelector('[data-dialogue-safe]');if(safe)safe.onclick=async()=>{await api(`/api/dialogue/runs/${state.active.run_id}/approve-safe`,{method:'POST',body:'{}'});toast('Safe dialogue suggestions approved');await selectRun(state.active.run_id)};document.querySelectorAll('[data-dialogue-action]').forEach(b=>b.onclick=async()=>{await api(`/api/dialogue/runs/${state.active.run_id}/edits/${b.dataset.edit}/action`,{method:'POST',body:JSON.stringify({action:b.dataset.dialogueAction})});await selectRun(state.active.run_id)});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const j=state.active.omni_manifest.jobs.find(x=>x.job_id===b.dataset.copy);navigator.clipboard.writeText(j.prompt);toast('Prompt copied')});document.querySelectorAll('[data-upload]').forEach(i=>i.onchange=()=>uploadResult(i.dataset.upload,i.files[0]));document.querySelectorAll('[data-job-action]').forEach(b=>b.onclick=()=>jobAction(b.dataset.job,b.dataset.jobAction))}
async function runAction(a){const map={analyse:'analyse',clean:'clean',direct:'direct',prepare:'prepare-jobs',finalise:'finalise-omni',preview:'preview',render:'approve-render'};try{await api(`/api/runs/${state.active.run_id}/${map[a]}`,{method:'POST',body:'{}'});toast('Started');await selectRun(state.active.run_id)}catch(e){toast(e.message)}}
async function uploadResult(job,file){if(!file)return;const fd=new FormData();fd.append('video',file);try{toast('Uploading and normalising…');await api(`/api/runs/${state.active.run_id}/omni/${job}/result`,{method:'POST',body:fd});toast('Result ready for review');await selectRun(state.active.run_id)}catch(e){toast(e.message)}}
async function jobAction(job,action){try{await api(`/api/runs/${state.active.run_id}/omni/${job}/action`,{method:'POST',body:JSON.stringify({action})});toast(`${job}: ${action}`);await selectRun(state.active.run_id)}catch(e){toast(e.message)}}
$('#newBtn').onclick=()=>$('#createDialog').showModal();$('#closeDialog').onclick=()=>$('#createDialog').close();$('#createForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{const r=await api('/api/runs',{method:'POST',body:fd});$('#createDialog').close();await loadRuns();await selectRun(r.run_id);toast('Production created')}catch(err){toast(err.message)}};boot();
</script>
</body>
</html>
